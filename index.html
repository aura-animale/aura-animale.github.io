<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pioche & Connecte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brown-deep: #6b4a34;
    --brown-mid: #7a583c;
    --sand-light: #f7f1e6;
    --page-bg: #F7CFAE;
    --btn-bg: #6b4a34;
    --ink: #2b1c12;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: var(--page-bg);
    font-family: 'Montserrat', sans-serif;
    color: var(--ink);
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px 100px;
  }

  .brand-text {
    font-family: 'Montserrat', sans-serif;
    font-weight: 500;
    font-size: 14px;
    line-height: 1.5;
    color: var(--brown-mid);
    text-align: center;
    margin: 0;
    max-width: 320px;
  }

  .stage {
    position: relative;
    perspective: 1400px;
    margin: 30px 0 8px;
  }

  .card-stack {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    background: var(--brown-deep);
    border: 1.5px solid var(--brown-mid);
  }

  .card-stack.layer-2 {
    transform: translate(7px, 9px) rotate(2deg);
    z-index: 1;
    opacity: 0.9;
    box-shadow: 0 10px 20px rgba(68,43,28,0.22);
  }

  .card-stack.layer-1 {
    transform: translate(4px, 5px) rotate(1deg);
    z-index: 2;
    opacity: 0.95;
  }

  .card {
    position: relative;
    z-index: 3;
    width: min(62vw, 250px);
    aspect-ratio: 5 / 7;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.65s cubic-bezier(.3,1.4,.6,1);
  }

  .card.flipped {
    transform: translateY(-16px) scale(1.04) rotateY(180deg);
  }

  .card:focus-visible {
    outline: 3px solid var(--btn-bg);
    outline-offset: 6px;
  }

  .face {
    position: absolute;
    inset: 0;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 18px;
    gap: 14px;
  }

  .face-back {
    background: var(--brown-deep);
    border: 1.5px solid var(--brown-mid);
    box-shadow: 0 14px 30px rgba(68,43,28,0.28);
  }

  .face-back img {
    width: 68%;
    height: auto;
    display: block;
  }

  .face-back .prompt {
    font-family: 'Montserrat', sans-serif;
    font-weight: 500;
    font-size: 13px;
    color: var(--sand-light);
    letter-spacing: 0.02em;
    margin: 0;
  }

  .face-front {
    background: var(--sand-light);
    border: 1.5px solid var(--brown-mid);
    transform: rotateY(180deg);
    justify-content: space-between;
  }

  .face-front .num {
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--brown-mid);
  }

  .face-front .instruction {
    font-family: 'Archivo Black', sans-serif;
    font-weight: 400;
    font-size: clamp(11.5px, 2.6vw, 13.5px);
    line-height: 1.35;
    color: var(--ink);
  }

  .face-front .tag {
    font-family: 'Montserrat', sans-serif;
    font-size: 10.5px;
    color: var(--brown-mid);
    letter-spacing: 0.06em;
  }

  .post-draw {
    max-width: 320px;
    text-align: center;
    margin-top: 18px;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  .post-draw.visible { opacity: 1; }

  .action {
    margin-top: 24px;
    background: var(--btn-bg);
    border: none;
    color: #ffffff;
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 13px;
    padding: 12px 26px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(74,84,130,0.25);
    transition: background 0.2s ease;
  }

  .action:hover { background: #55392a; }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
  }
</style>
</head>

      <div class="face face-front">
        <span class="num" id="cardNum">01</span>
        <p class="instruction" id="cardText">Texte de la carte</p>
        <span class="tag" id="cardTag">une musique</span>
      </div>
    </div>
  </div>

  <button class="action" id="drawBtn">Tire une carte</button>

  <div class="post-draw" id="postDraw">
    <p class="brand-text"><strong> Prends le temps qu'il te faut.  </strong> <br> Laisse venir un mot, <br> une émotion, une image ... <br> <br>  Et si rien ne vient, pas de pression, <br> c'est juste un jeu !</p>
  </div>

<script>
  const cards = [
    { text: "Ferme les yeux. <br> Laisse une musique te venir spontanément, ou choisis-la au hasard dans ta playlist. <br> Écoute-la en pensant à ton animal.", tag: "une musique" },
    { text: "Prends une grande inspiration. <br> En expirant, compte lentement de 10 à 1. <br> À zéro, ressens ton cœur connecté à celui de ton animal.", tag: "décompte cœur à cœur" },
    { text: "Calmement, inspire 4 temps, retiens l'air 4 temps, puis expire 4 temps, et reste 4 temps sans respirer, si tu le peux. <br> Recommence 3 fois.", tag: "respiration 4 temps" },
    { text: "Debout, secoue tout ton corps pendant 30 secondes, comme le fait ton animal pour évacuer un trop-plein. <br> Tu peux mettre une musique pour te motiver. <br> Puis arrête-toi et ressens.", tag: "shaking" },
    { text: "Pose ta main sur ton cœur, en respirant calmement. <br> Pense doucement au prénom de ton animal, comme un murmure.", tag: "main sur le cœur" },
    { text: "Regarde une photo de ton animal <br> pendant 30 secondes, sans réfléchir. <br> Laisse venir les images ou les sensations.", tag: "photo 30 secondes" },
    { text: "Ferme les yeux <br> et dis « bonjour » à ton animal dans ta tête, comme tu le ferais à un ami. <br> Et s'il te répondait ?", tag: "bonjour mental" },
    { text: "Marche pieds nus pendant un instant en pensant à ton animal. Sens le sol sous tes pieds. Sa texture, sa fraîcheur ... <br> (En extérieur, c'est encore mieux !)", tag: "pieds nus" },
    { text: "Ferme les yeux et pense à ton animal. <br> Est-ce qu'une couleur vient ? <br> Laisse-la remplir ton esprit quelques secondes.", tag: "couleur" },
    { text: "Souris, ferme les yeux, et attends la première image, sensation ou mot qui vient. <br> C'est ton message.", tag: "sourire" },
    { text: "Mets-toi à côté de lui. <br> Pose-lui une question à voix haute. <br> Observe-le.", tag: "voix haute" },
    { text: "Pose ta main sur lui. Sans bouger.  <br> Prends de grandes respirations, ressens son rythme.", tag: "connexion physique" }
  ];

  const card = document.getElementById('card');
  const cardText = document.getElementById('cardText');
  const cardNum = document.getElementById('cardNum');
  const cardTag = document.getElementById('cardTag');
  const drawBtn = document.getElementById('drawBtn');
  const postDraw = document.getElementById('postDraw');
  let flipped = false;
  let lastIndex = -1;

  function pickCard() {
    let i;
    do { i = Math.floor(Math.random() * cards.length); } while (i === lastIndex && cards.length > 1);
    lastIndex = i;
    cardNum.textContent = String(i + 1).padStart(2, '0');
    cardText.innerHTML = cards[i].text;
    cardTag.textContent = cards[i].tag;
  }

  function draw() {
    if (!flipped) {
      pickCard();
      card.classList.add('flipped');
      flipped = true;
      drawBtn.textContent = "Tirer une autre carte";
      setTimeout(() => {
        postDraw.classList.add('visible');
      }, 350);
    } else {
      card.classList.remove('flipped');
      flipped = false;
      postDraw.classList.remove('visible');
      setTimeout(() => { if (!flipped) draw(); }, 550);
    }
  }

  card.addEventListener('click', draw);
  card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); draw(); } });
  drawBtn.addEventListener('click', draw);
</script>
